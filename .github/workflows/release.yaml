name: Offline OTA image builder Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Offline OTA image builder Release version (e.g. 1.0.0)"
        required: true
        type: string

  push:
    tags:
      - "offline_ota_image_builder_v*"

permissions: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # glibc compatible with ubuntu:20.04 and newer
      image: debian:bullseye

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates binutils

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=offline_ota_image_builder_v${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Extract version from tag: offline_ota_image_builder_v1.0.0 -> 1.0.0
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#offline_ota_image_builder_v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.11"

      - name: Build binary with PyInstaller
        run: |
          uv run --locked pyinstaller \
            --onefile -s \
            --name offline_ota_image_builder \
            --clean \
            src/offline_ota_image_builder/__main__.py

      - name: calculate checksum
        uses: ./.github/actions/calculate_checksum
        with:
          file_patterns: "*"
          directory: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Offline OTA Image Builder v${{ steps.version.outputs.version }}"
          files: |
            dist/*
